name: Turbo tests

# Runs the kit's suite (tests/run-tests.js) on Windows, macOS and Linux. Optional tools are
# installed so every code path is exercised: typescript (exact TS outlines and checks),
# Playwright + Chromium (the smoke test) and the claude CLI (plugin manifest validation).
# The suite skips, never fails, when an optional tool is absent, so it also works bare.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '24.x']
        exclude:
          - os: macos-latest
            node: '20.x'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install optional tools (typescript, Playwright, claude CLI)
        shell: bash
        run: |
          npm install -g typescript@5 playwright @anthropic-ai/claude-code
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Environment
        shell: bash
        run: |
          node --version
          (python3 --version || python --version || py -3 --version) 2>/dev/null || echo "no python"
          (pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()') 2>/dev/null || echo "no pwsh"
          (rg --version | head -1) 2>/dev/null || echo "no ripgrep"
          (claude --version) 2>/dev/null || echo "no claude"

      - name: Run the suite
        shell: bash
        run: node tests/run-tests.js

      - name: Build the distributable zip
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        shell: bash
        run: node package.js && unzip -l dist/*.zip | tail -3

      - name: Upload the kit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6
        with:
          name: turbo-kit
          path: dist/*.zip
          if-no-files-found: error
